worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # Vite main bundle: stale cached index.html can reference an old hashed file
        location ~ ^/assets/index-[a-zA-Z0-9_-]+\.js$ {
            try_files $uri /assets/index-current.js @asset_404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~* \.(js|css|mjs|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|webp|svg)$ {
            try_files $uri @asset_404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location @asset_404 {
            add_header Cache-Control "no-store";
            add_header Content-Type "application/octet-stream";
            return 404 "";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
