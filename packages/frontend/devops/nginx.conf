worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Never cache index.html - ensures users get fresh HTML after deploy with correct
        # asset hashes. Prevents "Unexpected token '<'" when cached HTML requests old JS.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # Main bundle: if exact hash file missing (cached index.html with old hash), serve current bundle
        # so the app works without hard refresh. Symlink index-current.js is created in Dockerfile.
        location ~ ^/_expo/static/js/web/index-[a-f0-9]+\.js$ {
            try_files $uri /_expo/static/js/web/index-current.js @asset_404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Static assets (hashed .js, .css, etc.) - if file missing, return 404 with non-HTML
        # body so browser shows "script failed to load" instead of "Unexpected token '<'".
        location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|webp|svg)$ {
            try_files $uri @asset_404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        # 404 for missing assets: empty body, non-HTML Content-Type so browser never parses as HTML
        # (avoids "Unexpected token '<'" when nginx would otherwise serve HTML 404 page)
        location @asset_404 {
            add_header Cache-Control "no-store";
            add_header Content-Type "application/octet-stream";
            return 404 "";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
} 