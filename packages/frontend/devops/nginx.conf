worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Never cache index.html - ensures users get fresh HTML after deploy with correct
        # asset hashes. Prevents "Unexpected token '<'" when cached HTML requests old JS.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # Static assets (hashed .js, .css, etc.) - if file missing, return 404 instead of
        # serving index.html (which would cause "Unexpected token '<'" when parsed as JS).
        location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|webp|svg)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
} 