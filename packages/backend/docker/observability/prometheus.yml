# Scrape the API running on the host (yarn workspace @bianca-app/backend dev).
# Requires extra_hosts host.docker.internal on the Prometheus service (Linux).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: bianca-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3000
