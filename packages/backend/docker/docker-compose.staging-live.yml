# Staging-only live dev overlay — use with base docker-compose.yml on the EC2 instance:
#   docker compose -f docker-compose.yml -f docker-compose.staging-live.yml up -d
# NOT used on production. Requires synced source at /opt/bianca-staging/dev-src.

services:
  app:
    image: bianca-staging-live-backend
    build:
      context: /opt/bianca-staging/dev-src
      dockerfile: packages/backend/docker/Dockerfile.staging-live-backend
    volumes:
      - /opt/bianca-staging/dev-src/packages/backend/src:/app/packages/backend/src
      - /opt/bianca-staging/dev-src/packages/backend/migrations:/app/packages/backend/migrations
      - /opt/bianca-staging/dev-src/packages/backend/tests/fixtures:/app/packages/backend/tests/fixtures
      - /opt/bianca-staging/dev-src/packages/backend/nodemon.json:/app/packages/backend/nodemon.json
    working_dir: /app/packages/backend
    command: ["yarn", "dev:staging"]
    environment:
      - NODE_ENV=staging

  frontend:
    image: bianca-staging-live-frontend
    build:
      context: /opt/bianca-staging/dev-src
      dockerfile: packages/backend/docker/Dockerfile.staging-live-frontend
    volumes:
      - /opt/bianca-staging/dev-src/packages/web/src:/app/packages/web/src
      - /opt/bianca-staging/dev-src/packages/web/index.html:/app/packages/web/index.html
      - /opt/bianca-staging/dev-src/packages/web/vite.config.ts:/app/packages/web/vite.config.ts
      - /opt/bianca-staging/dev-src/packages/shared/src:/app/packages/shared/src
      - /opt/bianca-staging/dev-src/packages/ui/src:/app/packages/ui/src
    # No host ports — nginx reaches frontend:5173 on the Docker network.
    # (Base compose publishes 3001:80; remote-start strips that to avoid merge conflicts.)
    environment:
      - VITE_API_URL=https://staging-api.biancawellness.com/v1
      - VITE_MOBILE_APP_URL=https://staging-mobile.biancawellness.com
      - VITE_USE_POLLING=1
      - VITE_STAGING_LIVE=1
    command:
      [
        "sh",
        "-c",
        "yarn dev --host 0.0.0.0 --port 5173",
      ]

  nginx:
    volumes:
      - ./nginx.live-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/maintenance-mode.flag:/opt/maintenance-mode.flag:ro
      - /opt/maintenance.html:/opt/maintenance.html:ro
