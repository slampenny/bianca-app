version: 0.2

phases:
  pre_build:
    commands:
      - echo "Getting sequential build number..."
      - |
        # Get sequential build number from S3 (increments globally across all projects)
        SEQUENTIAL_BUILD_NUMBER=$(bash "$CODEBUILD_SRC_DIR/packages/backend/devops/scripts/get-sequential-build-number.sh" bianca-staging-pipeline)
        export SEQUENTIAL_BUILD_NUMBER
        echo "Sequential Build Number: $SEQUENTIAL_BUILD_NUMBER"
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - echo "Build started on $(date)"
      - |
        echo "Build Number: $SEQUENTIAL_BUILD_NUMBER (CodeBuild: ${CODEBUILD_BUILD_NUMBER})"
      - echo Building Docker images...
      - echo "Configuring Git to preserve binary files..."
      - git config --global core.autocrlf false
      - git config --global core.eol lf
      - echo "Refreshing Git attributes to ensure binary files are correct..."
      - echo "Pre-pulling base images to avoid rate limits..."
      - |
        # Pre-pull from ECR Public to avoid Docker Hub rate limits
        # The Dockerfile uses ECR Public directly, but pre-pulling here ensures it's available
        echo "   Pulling node:20-bullseye from ECR Public..."
        if docker pull public.ecr.aws/docker/library/node:20-bullseye 2>/dev/null; then
          echo "✅ Pre-pulled node image from ECR Public"
        else
          echo "⚠️  Could not pre-pull from ECR Public, Dockerfile will try to pull during build"
          # Try to authenticate with Docker Hub if credentials are available (fallback)
          if [ -n "$DOCKER_HUB_USERNAME" ] && [ -n "$DOCKER_HUB_PASSWORD" ]; then
            echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin 2>/dev/null || true
            echo "   Authenticated with Docker Hub as fallback"
          fi
        fi

  build:
    commands:
      - echo Building backend, frontend, and asterisk images...
      - pwd
      - echo Source directory is $CODEBUILD_SRC_DIR
      - ls -la | head -10
      - |
        # Build backend image (monorepo root context — yarn.lock lives at repo root)
        echo "🔨 Building backend image..."
        cd "$CODEBUILD_SRC_DIR"
        # Use --no-cache for staging to ensure we always get fresh code
        # Staging should always rebuild with latest code, not use any cached layers
        echo "   Building with --no-cache to ensure fresh code..."
        if docker build --no-cache \
                     --build-arg BUILD_TIMESTAMP=$(date +%s) \
                     --build-arg GIT_COMMIT=$CODEBUILD_RESOLVED_SOURCE_VERSION \
                     -t $ECR_REGISTRY/bianca-app-backend:latest \
                     -t $ECR_REGISTRY/bianca-app-backend:staging \
                     -t $ECR_REGISTRY/bianca-app-backend:$CODEBUILD_RESOLVED_SOURCE_VERSION \
                     -f packages/backend/docker/Dockerfile .; then
          echo "✅ Backend build complete"
          # Verify ecosystem.config.json doesn't have hardcoded NODE_ENV (only if build succeeded)
          echo "🔍 Verifying ecosystem.config.json in built image..."
          # Only check locally built image - don't pull from ECR
          if docker images --format "{{.Repository}}:{{.Tag}}" | grep -q "^${ECR_REGISTRY}/bianca-app-backend:staging$"; then
            if docker run --rm $ECR_REGISTRY/bianca-app-backend:staging cat ecosystem.config.json 2>/dev/null | grep -q '"NODE_ENV"'; then
              echo "❌ ERROR: ecosystem.config.json still contains hardcoded NODE_ENV!"
              docker run --rm $ECR_REGISTRY/bianca-app-backend:staging cat ecosystem.config.json
              exit 1
            else
              echo "✅ Verified: ecosystem.config.json does NOT have hardcoded NODE_ENV"
            fi
          else
            echo "⚠️  WARNING: Could not verify - image tag not found locally (build may have failed)"
            exit 1
          fi
        else
          echo "❌ Backend build FAILED!"
          exit 1
        fi
      - |
        # Build asterisk image
        echo "🔨 Building asterisk image..."
        cd packages/backend/devops/asterisk
        # Use --no-cache for staging to ensure we always get fresh code
        docker build --no-cache -t $ECR_REGISTRY/bianca-app-asterisk:staging .
        cd ../../..
        echo "✅ Asterisk build complete"
      - |
        # Build frontend image
        echo "🔨 Building frontend image..."
        # Ensure we're in the root directory
        cd "$CODEBUILD_SRC_DIR"
        pwd
        ls -la packages/ | head -5
        if [ ! -d "packages/web" ]; then
          echo "ERROR: packages/web directory not found!"
          ls -la packages/
          exit 1
        fi
        echo "   Building @bianca-app/web Docker image (monorepo root context)..."
        if docker build --no-cache \
                     --build-arg BUILD_ENV=staging \
                     --build-arg VITE_API_URL=https://staging-api.biancawellness.com/v1 \
                     --build-arg VITE_ADMIN_APP_ORIGIN=https://staging-admin.biancawellness.com \
                     --build-arg VITE_MOBILE_APP_URL=https://staging-mobile.biancawellness.com \
                     -t $ECR_REGISTRY/bianca-app-frontend:latest \
                     -t $ECR_REGISTRY/bianca-app-frontend:staging \
                     -f packages/web/devops/Dockerfile .; then
          echo "✅ Frontend build complete"
        else
          echo "❌ Frontend build FAILED!"
          exit 1
        fi
      - |
        # Build super-admin image (separate container on same EC2 as facility web)
        echo "Building super-admin image..."
        cd "$CODEBUILD_SRC_DIR"
        if docker build --no-cache \
                     --build-arg BUILD_ENV=staging \
                     --build-arg VITE_API_URL=https://staging-api.biancawellness.com/v1 \
                     --build-arg VITE_FACILITY_APP_URL=https://staging.biancawellness.com/ \
                     -t $ECR_REGISTRY/bianca-app-admin:latest \
                     -t $ECR_REGISTRY/bianca-app-admin:staging \
                     -f packages/admin/devops/Dockerfile .; then
          echo "Super-admin build complete"
        else
          echo "Super-admin build FAILED!"
          exit 1
        fi
      - |
        # Push all images
        echo "📦 Pushing backend images..."
        docker push $ECR_REGISTRY/bianca-app-backend:latest
        docker push $ECR_REGISTRY/bianca-app-backend:staging
        docker push $ECR_REGISTRY/bianca-app-backend:$CODEBUILD_RESOLVED_SOURCE_VERSION
        echo "📦 Pushing asterisk image..."
        docker push $ECR_REGISTRY/bianca-app-asterisk:staging
        echo "📦 Pushing frontend images..."
        docker push $ECR_REGISTRY/bianca-app-frontend:latest
        docker push $ECR_REGISTRY/bianca-app-frontend:staging
        echo "📦 Pushing super-admin images..."
        docker push $ECR_REGISTRY/bianca-app-admin:latest
        docker push $ECR_REGISTRY/bianca-app-admin:staging
        echo "✅ All images pushed successfully"

  post_build:
    commands:
      - echo Build completed
      - echo Packaging CodeDeploy artifacts...
      - |
        # Ensure we're in the backend source directory
        cd "$CODEBUILD_SRC_DIR/packages/backend"
        pwd
        echo Verifying scripts exist...
        ls -la devops/codedeploy/scripts/
        echo Checking before_install.sh content...
        head -5 devops/codedeploy/scripts/before_install.sh
        wc -l devops/codedeploy/scripts/before_install.sh
        # Copy artifacts to root directory for CodeBuild
        cp devops/codedeploy/appspec.yml "$CODEBUILD_SRC_DIR/appspec.yml"
        # Copy scripts directory contents to root
        mkdir -p "$CODEBUILD_SRC_DIR/scripts"
        cp devops/codedeploy/scripts/* "$CODEBUILD_SRC_DIR/scripts/"
        chmod +x "$CODEBUILD_SRC_DIR/scripts"/*.sh
        echo Verifying copied scripts...
        ls -la "$CODEBUILD_SRC_DIR/scripts/"
        wc -l "$CODEBUILD_SRC_DIR/scripts/before_install.sh"
        echo CodeDeploy artifacts packaged

artifacts:
  files:
    - 'appspec.yml'
    - 'scripts/**/*'
  name: BuildOutput

