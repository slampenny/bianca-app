version: 0.2

# Post-Deployment Validation (Blue-Green)
# Tests that the green instance is accessible and healthy before swapping traffic
# For blue-green deployments, we validate the green instance directly by IP
# before swapping ALB target groups to ensure zero-downtime

phases:
  pre_build:
    commands:
      - echo "Starting post-deployment validation (blue-green mode)..."
      - |
        echo "Frontend URL: ${FRONTEND_URL}"
        echo "API URL: ${API_URL}"
        echo "Max retries: ${MAX_RETRIES:-20}"
        echo "Retry delay: ${RETRY_DELAY:-10} seconds"
        
        # Read green instance info from previous stage
        if [ -f instance-info.txt ]; then
          source instance-info.txt
          echo "Green instance ID: ${GREEN_INSTANCE_ID:-not found}"
          echo "Green instance IP: ${GREEN_INSTANCE_IP:-not found}"
        else
          echo "⚠️  Warning: instance-info.txt not found, will validate via public URLs"
        fi

  build:
    commands:
      - |
        # Determine if we're in blue-green mode (green instance exists)
        BLUE_GREEN_MODE=false
        if [ -f instance-info.txt ] && [ -n "$GREEN_INSTANCE_IP" ] && [ "$GREEN_INSTANCE_IP" != "None" ]; then
          BLUE_GREEN_MODE=true
          echo "🔵 Blue-Green Mode: Validating green instance directly by IP"
          echo "   Green instance IP: $GREEN_INSTANCE_IP"
        else
          echo "🔵 Standard Mode: Validating via public URLs (ALB)"
        fi
        
        # Wait for instance/containers to be ready
        if [ "$BLUE_GREEN_MODE" = "true" ]; then
          echo "Waiting 60 seconds for green instance containers to be ready..."
        else
          echo "Waiting 60 seconds for ALB to register instance and pass health checks..."
        fi
        sleep 60
        
        # Function to test URL with retries
        test_url() {
          local url=$1
          local description=$2
          local max_retries=${MAX_RETRIES:-20}
          local retry_delay=${RETRY_DELAY:-10}
          local attempt=1
          
          echo "Testing $description: $url"
          
          while [ $attempt -le $max_retries ]; do
            # Capture both HTTP code and response body for debugging
            RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 30 --connect-timeout 10 "$url" 2>&1 || echo -e "\n000")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            RESPONSE_BODY=$(echo "$RESPONSE" | head -n -1)
            
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ $description is accessible (HTTP $HTTP_CODE, attempt $attempt)"
              return 0
            elif [ "$HTTP_CODE" = "503" ]; then
              echo "❌ $description returned 503 Service Unavailable (attempt $attempt/$max_retries)"
              echo "   This indicates the ALB has no healthy targets, maintenance mode is enabled, or the service is down"
              echo "   Response: ${RESPONSE_BODY:0:200}"
            elif [ "$HTTP_CODE" = "000" ]; then
              echo "⚠️  $description connection failed (attempt $attempt/$max_retries) - may still be deploying"
              echo "   Error: ${RESPONSE_BODY:0:200}"
            elif [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "504" ]; then
              echo "⚠️  $description returned HTTP $HTTP_CODE Bad Gateway (attempt $attempt/$max_retries)"
              echo "   This may indicate the backend is still starting up or ALB can't reach targets"
              echo "   Response: ${RESPONSE_BODY:0:200}"
            else
              echo "⚠️  $description returned HTTP $HTTP_CODE (attempt $attempt/$max_retries)"
              echo "   Response: ${RESPONSE_BODY:0:200}"
            fi
            
            if [ $attempt -lt $max_retries ]; then
              echo "   Waiting ${retry_delay}s before retry..."
              sleep $retry_delay
            fi
            attempt=$((attempt + 1))
          done
          
          echo "❌ $description validation FAILED after $max_retries attempts"
          echo "   Final HTTP code: $HTTP_CODE"
          echo "   URL: $url"
          return 1
        }
        
        # Track failures
        VALIDATION_FAILED=false
        
        if [ "$BLUE_GREEN_MODE" = "true" ]; then
          # Blue-Green Mode: Test green instance directly by IP
          echo ""
          echo "Testing green instance directly (bypassing ALB)..."
          
          # Test API on green instance (port 3000)
          GREEN_API_URL="http://${GREEN_INSTANCE_IP}:3000"
          if ! test_url "$GREEN_API_URL/health" "Green instance API health endpoint"; then
            VALIDATION_FAILED=true
          fi
          
          # Test frontend on green instance (port 80 via nginx)
          GREEN_FRONTEND_URL="http://${GREEN_INSTANCE_IP}"
          if ! test_url "$GREEN_FRONTEND_URL" "Green instance Frontend"; then
            VALIDATION_FAILED=true
          fi
          
          echo ""
          echo "✅ Green instance validation complete"
          echo "   If validation passed, pipeline will proceed to swap traffic"
        else
          # Standard Mode: Test via public URLs (ALB)
          echo ""
          echo "Testing via public URLs (ALB)..."
          
          # Test frontend URL
          if ! test_url "$FRONTEND_URL" "Frontend"; then
            VALIDATION_FAILED=true
          fi
          
          # Test API health endpoint
          if ! test_url "$API_URL/health" "API health endpoint"; then
            VALIDATION_FAILED=true
          fi
        fi
        
        # Final check
        if [ "$VALIDATION_FAILED" = "true" ]; then
          echo ""
          echo "❌ Post-deployment validation FAILED"
          echo "   One or more public URLs are not accessible"
          echo "   This means users cannot access the deployed site"
          echo ""
          echo "   Possible causes:"
          echo "   1. Instance not registered with ALB target groups"
          echo "   2. ALB target group health checks failing"
          echo "   3. Security group rules blocking traffic"
          echo "   4. DNS not pointing to ALB"
          echo "   5. Maintenance mode still enabled"
          echo "   6. Containers not running or unhealthy"
          echo ""
          echo "   The deployment may have succeeded locally but is not accessible to users"
          exit 1
        fi
        
        echo ""
        echo "✅ Post-deployment validation PASSED"
        echo "   All public URLs are accessible and responding correctly"

  post_build:
    commands:
      - echo "✅ Post-deployment validation completed successfully"
      - echo "The deployed site is accessible and working correctly"

