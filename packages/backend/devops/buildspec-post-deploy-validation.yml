version: 0.2

# Post-Deployment Validation
# Tests that the deployed site is actually accessible via public URLs
# This catches issues like 503 errors, ALB problems, DNS issues, etc.

phases:
  pre_build:
    commands:
      - echo "Starting post-deployment validation..."
      - |
        echo "Frontend URL: ${FRONTEND_URL}"
        echo "API URL: ${API_URL}"
        echo "Max retries: ${MAX_RETRIES:-20}"
        echo "Retry delay: ${RETRY_DELAY:-10} seconds"

  build:
    commands:
      - |
        # Step 1: Check and ensure containers are running on the instance
        echo "=========================================="
        echo "Step 1: Checking container health on instance"
        echo "=========================================="
        
        # Get staging instance ID
        STAGING_INSTANCE_ID=$(aws ec2 describe-instances \
          --filters "Name=tag:Name,Values=bianca-staging" "Name=instance-state-name,Values=running" \
          --query 'Reservations[0].Instances[0].InstanceId' \
          --output text \
          --region ${AWS_DEFAULT_REGION:-us-east-2} 2>/dev/null || echo "")
        
        if [ -z "$STAGING_INSTANCE_ID" ] || [ "$STAGING_INSTANCE_ID" = "None" ]; then
          echo "⚠️  WARNING: Could not find staging instance ID"
          echo "   Skipping container health check - will proceed with URL validation"
        else
          echo "✅ Found staging instance: $STAGING_INSTANCE_ID"
          
          # Function to check container status via SSM
          check_containers() {
            local instance_id=$1
            local command_id=$(aws ssm send-command \
              --instance-ids "$instance_id" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["cd /opt/bianca-staging && docker ps --filter \"name=staging_\" --format \"{{.Names}}:{{.Status}}\""]' \
              --query 'Command.CommandId' \
              --output text \
              --region ${AWS_DEFAULT_REGION:-us-east-2} 2>/dev/null || echo "")
            
            if [ -z "$command_id" ]; then
              echo "   ⚠️  Could not send SSM command to check containers"
              return 1
            fi
            
            # Wait for command to complete (max 30 seconds)
            sleep 3
            local status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --query 'Status' \
              --output text \
              --region ${AWS_DEFAULT_REGION:-us-east-2} 2>/dev/null || echo "Failed")
            
            if [ "$status" = "Success" ]; then
              local output=$(aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$instance_id" \
                --query 'StandardOutputContent' \
                --output text \
                --region ${AWS_DEFAULT_REGION:-us-east-2} 2>/dev/null || echo "")
              echo "$output"
              return 0
            else
              echo "   ⚠️  SSM command failed with status: $status"
              return 1
            fi
          }
          
          # Function to start containers via SSM
          start_containers() {
            local instance_id=$1
            echo "   Attempting to start containers on instance..."
            
            local command_id=$(aws ssm send-command \
              --instance-ids "$instance_id" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["cd /opt/bianca-staging && docker compose up -d --remove-orphans 2>&1"]' \
              --query 'Command.CommandId' \
              --output text \
              --region ${AWS_DEFAULT_REGION:-us-east-2} 2>/dev/null || echo "")
            
            if [ -z "$command_id" ]; then
              echo "   ❌ Could not send SSM command to start containers"
              return 1
            fi
            
            # Wait for command to complete (max 120 seconds)
            echo "   Waiting for containers to start (up to 120 seconds)..."
            local max_wait=120
            local waited=0
            while [ $waited -lt $max_wait ]; do
              sleep 5
              waited=$((waited + 5))
              local status=$(aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$instance_id" \
                --query 'Status' \
                --output text \
                --region ${AWS_DEFAULT_REGION:-us-east-2} 2>/dev/null || echo "Failed")
              
              if [ "$status" = "Success" ] || [ "$status" = "Failed" ]; then
                local output=$(aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$instance_id" \
                  --query 'StandardOutputContent' \
                  --output text \
                  --region ${AWS_DEFAULT_REGION:-us-east-2} 2>/dev/null || echo "")
                echo "   Container start output:"
                echo "$output" | head -20
                if [ "$status" = "Success" ]; then
                  echo "   ✅ Containers started successfully"
                  return 0
                else
                  echo "   ⚠️  Container start may have failed"
                  return 1
                fi
              fi
            done
            
            echo "   ⚠️  Container start command timed out"
            return 1
          }
          
          # Check if containers are running
          echo "   Checking container status..."
          CONTAINER_STATUS=$(check_containers "$STAGING_INSTANCE_ID")
          
          # Check if required containers are running
          NGINX_RUNNING=$(echo "$CONTAINER_STATUS" | grep -c "staging_nginx" || echo "0")
          APP_RUNNING=$(echo "$CONTAINER_STATUS" | grep -c "staging_app" || echo "0")
          FRONTEND_RUNNING=$(echo "$CONTAINER_STATUS" | grep -c "staging_frontend" || echo "0")
          
          echo "   Container status:"
          echo "   - Nginx: $NGINX_RUNNING"
          echo "   - App: $APP_RUNNING"
          echo "   - Frontend: $FRONTEND_RUNNING"
          
          # If containers aren't running, try to start them
          if [ "$NGINX_RUNNING" -eq 0 ] || [ "$APP_RUNNING" -eq 0 ] || [ "$FRONTEND_RUNNING" -eq 0 ]; then
            echo "   ⚠️  Some containers are not running"
            echo "$CONTAINER_STATUS"
            
            # Try to start containers
            if start_containers "$STAGING_INSTANCE_ID"; then
              echo "   ✅ Containers started, waiting 30 seconds for initialization..."
              sleep 30
              
              # Re-check container status
              CONTAINER_STATUS=$(check_containers "$STAGING_INSTANCE_ID")
              NGINX_RUNNING=$(echo "$CONTAINER_STATUS" | grep -c "staging_nginx" || echo "0")
              APP_RUNNING=$(echo "$CONTAINER_STATUS" | grep -c "staging_app" || echo "0")
              FRONTEND_RUNNING=$(echo "$CONTAINER_STATUS" | grep -c "staging_frontend" || echo "0")
              
              echo "   Container status after start:"
              echo "   - Nginx: $NGINX_RUNNING"
              echo "   - App: $APP_RUNNING"
              echo "   - Frontend: $FRONTEND_RUNNING"
              
              if [ "$NGINX_RUNNING" -eq 0 ] || [ "$APP_RUNNING" -eq 0 ] || [ "$FRONTEND_RUNNING" -eq 0 ]; then
                echo "   ⚠️  WARNING: Some containers still not running after start attempt"
                echo "   Proceeding with URL validation anyway..."
              fi
            else
              echo "   ⚠️  WARNING: Failed to start containers"
              echo "   Proceeding with URL validation anyway..."
            fi
          else
            echo "   ✅ All required containers are running"
          fi
        fi
        
        echo ""
        echo "=========================================="
        echo "Step 2: Testing public URLs"
        echo "=========================================="
        
        # Function to test URL with retries
        test_url() {
          local url=$1
          local description=$2
          local max_retries=${MAX_RETRIES:-20}
          local retry_delay=${RETRY_DELAY:-10}
          local attempt=1
          
          echo "Testing $description: $url"
          
          while [ $attempt -le $max_retries ]; do
            # Capture both HTTP code and response body for debugging
            RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 30 --connect-timeout 10 "$url" 2>&1 || echo -e "\n000")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            RESPONSE_BODY=$(echo "$RESPONSE" | head -n -1)
            
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ $description is accessible (HTTP $HTTP_CODE, attempt $attempt)"
              return 0
            elif [ "$HTTP_CODE" = "503" ]; then
              echo "❌ $description returned 503 Service Unavailable (attempt $attempt/$max_retries)"
              echo "   This indicates the ALB has no healthy targets, maintenance mode is enabled, or the service is down"
              echo "   Response: ${RESPONSE_BODY:0:200}"
            elif [ "$HTTP_CODE" = "000" ]; then
              echo "⚠️  $description connection failed (attempt $attempt/$max_retries) - may still be deploying"
              echo "   Error: ${RESPONSE_BODY:0:200}"
            elif [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "504" ]; then
              echo "⚠️  $description returned HTTP $HTTP_CODE Bad Gateway (attempt $attempt/$max_retries)"
              echo "   This may indicate the backend is still starting up or ALB can't reach targets"
              echo "   Response: ${RESPONSE_BODY:0:200}"
            else
              echo "⚠️  $description returned HTTP $HTTP_CODE (attempt $attempt/$max_retries)"
              echo "   Response: ${RESPONSE_BODY:0:200}"
            fi
            
            if [ $attempt -lt $max_retries ]; then
              echo "   Waiting ${retry_delay}s before retry..."
              sleep $retry_delay
            fi
            attempt=$((attempt + 1))
          done
          
          echo "❌ $description validation FAILED after $max_retries attempts"
          echo "   Final HTTP code: $HTTP_CODE"
          echo "   URL: $url"
          return 1
        }
        
        # Track failures
        VALIDATION_FAILED=false
        
        # Test frontend URL
        if ! test_url "$FRONTEND_URL" "Frontend"; then
          VALIDATION_FAILED=true
        fi
        
        # Test API health endpoint
        if ! test_url "$API_URL/health" "API health endpoint"; then
          VALIDATION_FAILED=true
        fi
        
        # Final check
        if [ "$VALIDATION_FAILED" = "true" ]; then
          echo ""
          echo "❌ Post-deployment validation FAILED"
          echo "   One or more public URLs are not accessible"
          echo "   This means users cannot access the deployed site"
          echo ""
          echo "   Possible causes:"
          echo "   1. Instance not registered with ALB target groups"
          echo "   2. ALB target group health checks failing"
          echo "   3. Security group rules blocking traffic"
          echo "   4. DNS not pointing to ALB"
          echo "   5. Maintenance mode still enabled"
          echo "   6. Containers not running or unhealthy"
          echo ""
          echo "   The deployment may have succeeded locally but is not accessible to users"
          exit 1
        fi
        
        echo ""
        echo "✅ Post-deployment validation PASSED"
        echo "   All public URLs are accessible and responding correctly"

  post_build:
    commands:
      - echo "✅ Post-deployment validation completed successfully"
      - echo "The deployed site is accessible and working correctly"

