version: 0.2

phases:
  pre_build:
    commands:
      - echo Starting blue-green swap
      - echo API Target Group ARN is ${API_TARGET_GROUP_ARN}
      - echo Frontend Target Group ARN is ${FRONTEND_TARGET_GROUP_ARN}

  build:
    commands:
      - |
        # Read instance info from CreateGreenInstance artifact (try all CodePipeline paths)
        INSTANCE_INFO_LOADED=false
        for path in instance-info.txt ../CreateGreenInstance/instance-info.txt GreenInstanceOutput/instance-info.txt; do
          if [ -f "$path" ]; then
            . "$path"
            echo "Loaded instance-info from $path"
            INSTANCE_INFO_LOADED=true
            break
          fi
        done
        if [ -n "${CODEBUILD_SRC_DIR_GreenInstanceOutput:-}" ] && [ -f "${CODEBUILD_SRC_DIR_GreenInstanceOutput}/instance-info.txt" ]; then
          . "${CODEBUILD_SRC_DIR_GreenInstanceOutput}/instance-info.txt"
          echo "Loaded instance-info from GreenInstanceOutput artifact"
          INSTANCE_INFO_LOADED=true
        fi
        if [ "$INSTANCE_INFO_LOADED" = "false" ]; then
          echo "⚠️  Warning: instance-info.txt not found, attempting to discover instances..."
        fi
        
        GREEN_TAG="${GREEN_TAG:-bianca-staging-green}"
        BLUE_TAG="${BLUE_TAG:-bianca-staging}"
        # Deploy directory (staging: /opt/bianca-staging, production: /opt/bianca-production)
        DEPLOY_DIR="/opt/${BLUE_TAG}"
        echo "Deploy directory: $DEPLOY_DIR"
        # Artifact instance-info can reference a terminated green after a failed swap; ignore stale IDs.
        if [ -n "$GREEN_INSTANCE_ID" ] && [ "$GREEN_INSTANCE_ID" != "None" ]; then
          G_ST=$(aws ec2 describe-instances --instance-ids "$GREEN_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text 2>/dev/null || echo "")
          if [ "$G_ST" != "running" ]; then
            echo "⚠️  GREEN_INSTANCE_ID from artifact ($GREEN_INSTANCE_ID) is not running (state=$G_ST); discovering from tags..."
            GREEN_INSTANCE_ID=""
          fi
        fi
        # Newest running instance wins if duplicates exist (Reservations[0] order is undefined).
        if [ -z "$GREEN_INSTANCE_ID" ] || [ "$GREEN_INSTANCE_ID" = "None" ]; then
          echo "Finding green instance (DeploymentType=green, newest by LaunchTime)..."
          GREEN_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$GREEN_TAG" \
                      "Name=instance-state-name,Values=running" \
            --output json | python3 "$CODEBUILD_SRC_DIR/packages/backend/devops/scripts/pick-newest-green-instance.py"
        fi
        
        if [ -z "$GREEN_INSTANCE_ID" ] || [ "$GREEN_INSTANCE_ID" = "None" ]; then
          echo "❌ ERROR: No running EC2 instance with Name tag: $GREEN_TAG"
          echo "   SwapAndTerminate must run after CreateGreenInstance finishes and the instance is running."
          echo "   Retrying only this stage before green exists (or from an old pipeline run) will fail."
          echo "   Run the full production pipeline, or wait for CreateGreenInstance + Deploy, then retry swap."
          aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$GREEN_TAG" \
            --query 'Reservations[].Instances[].{InstanceId:InstanceId,State:State.Name,LaunchTime:LaunchTime}' \
            --output table 2>/dev/null || true
          exit 1
        fi
        
        echo "Green instance: $GREEN_INSTANCE_ID"
        
        # Find blue instance if not in file
        if [ -z "$BLUE_INSTANCE_ID" ]; then
          echo "Finding blue instance..."
          # Get all running instances with BLUE_TAG name, then filter out the green instance
          BLUE_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$BLUE_TAG" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[?Tags[?Key=='DeploymentType' && Value=='blue']] | [0][0].InstanceId" \
            --output text 2>/dev/null || echo "")
          
          # If no instance with DeploymentType=blue, check if there's any instance (legacy without tag)
          if [ -z "$BLUE_INSTANCE_ID" ] || [ "$BLUE_INSTANCE_ID" = "None" ]; then
            # Exclude the green instance we just created
            BLUE_INSTANCE_ID=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=$BLUE_TAG" \
                        "Name=instance-state-name,Values=running" \
              --query "Reservations[*].Instances[?InstanceId!='$GREEN_INSTANCE_ID'] | [0][0].InstanceId" \
              --output text 2>/dev/null || echo "")
          fi
        fi
        
        if [ -z "$BLUE_INSTANCE_ID" ] || [ "$BLUE_INSTANCE_ID" = "None" ]; then
          echo "⚠️  No blue instance found (this might be the first deployment)"
          BLUE_INSTANCE_ID=""
        else
          echo "Blue instance (initial discovery): $BLUE_INSTANCE_ID"
        fi
        
        # Duplicate Name=BLUE_TAG fix: the MongoDB volume may be on a different running instance than
        # DeploymentType=blue (Terraform drift / failed prior swap). Prefer the volume holder as blue.
        DUPLICATE_BLUE_INSTANCE_IDS=""
        if [ -n "$GREEN_INSTANCE_ID" ] && [ -n "${MONGODB_DATA_VOLUME_TAG:-}" ]; then
          ALL_BLUES_RAW=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$BLUE_TAG" "Name=instance-state-name,Values=running" \
            --query 'Reservations[*].Instances[*].InstanceId' \
            --output text 2>/dev/null || echo "")
          ALL_BLUES=""
          for _bid in $ALL_BLUES_RAW; do
            [ "$_bid" = "None" ] && continue
            [ "$_bid" = "$GREEN_INSTANCE_ID" ] && continue
            ALL_BLUES="$ALL_BLUES $_bid"
          done
        
          VOL_OWNER=""
          for cand in $ALL_BLUES; do
            [ -z "$cand" ] && continue
            vtest=$(aws ec2 describe-volumes \
              --filters "Name=attachment.instance-id,Values=$cand" "Name=tag:Name,Values=$MONGODB_DATA_VOLUME_TAG" \
              --query 'Volumes[0].VolumeId' \
              --output text 2>/dev/null || echo "")
            [ "$vtest" = "None" ] && vtest=""
            if [ -z "$vtest" ]; then
              vtest=$(aws ec2 describe-volumes \
                --filters "Name=attachment.instance-id,Values=$cand" "Name=attachment.device,Values=/dev/sdf" \
                --query 'Volumes[0].VolumeId' \
                --output text 2>/dev/null || echo "")
              [ "$vtest" = "None" ] && vtest=""
            fi
            if [ -n "$vtest" ]; then
              VOL_OWNER="$cand"
              echo "MongoDB data volume $vtest is on $cand — using as blue for Step 0 migration."
              break
            fi
          done
        
          if [ -n "$VOL_OWNER" ]; then
            if [ -n "$BLUE_INSTANCE_ID" ] && [ "$BLUE_INSTANCE_ID" != "$VOL_OWNER" ]; then
              echo "⚠️  Previously selected blue was $BLUE_INSTANCE_ID (no volume there); switching to $VOL_OWNER."
            fi
            BLUE_INSTANCE_ID="$VOL_OWNER"
            for cand in $ALL_BLUES; do
              [ -z "$cand" ] && continue
              [ "$cand" = "$BLUE_INSTANCE_ID" ] && continue
              if [ -z "$DUPLICATE_BLUE_INSTANCE_IDS" ]; then
                DUPLICATE_BLUE_INSTANCE_IDS="$cand"
              else
                DUPLICATE_BLUE_INSTANCE_IDS="$DUPLICATE_BLUE_INSTANCE_IDS $cand"
              fi
            done
          fi
        fi
        
        if [ -n "$BLUE_INSTANCE_ID" ]; then
          echo "Blue instance (final): $BLUE_INSTANCE_ID"
        fi
        if [ -n "$DUPLICATE_BLUE_INSTANCE_IDS" ]; then
          echo "Will terminate stale duplicate(s) after primary blue: $DUPLICATE_BLUE_INSTANCE_IDS"
        fi
        
        # Terraform-managed SIP Elastic IP (staging vs production via env from CodeBuild)
        EIP_ALLOCATION_ID="${STAGING_EIP_ALLOCATION_ID:-${PRODUCTION_EIP_ALLOCATION_ID:-}}"
        
        # Step 0: Ensure the environment MongoDB EBS volume (tagged Name=MONGODB_DATA_VOLUME_TAG) is on green
        # and mounted before swap. Staging and production each use a different volume tag (see Terraform).
        # If Terraform attachment drifts after blue/green, the volume may be "available" — we attach it to green.
        #
        # CRITICAL: Run whenever we have a green instance — not only when blue exists. Otherwise a deploy with
        # a missing/empty blue discovery can skip this entire step and cut traffic to an app with no data volume.
        if [ -n "$GREEN_INSTANCE_ID" ]; then
          if [ -z "$MONGODB_DATA_VOLUME_TAG" ]; then
            echo "❌ CRITICAL: MONGODB_DATA_VOLUME_TAG is not set in CodeBuild (staging vs production Mongo volume)."
            echo "   Add bianca-staging-mongodb-data or bianca-production-mongodb-data to the swap project env in Terraform."
            exit 1
          fi
          echo ""
          echo "Step 0: MongoDB EBS volume (tag Name=$MONGODB_DATA_VOLUME_TAG)"
          NEED_BLUE_TEARDOWN=false
          VOLUME_ID=""
          if [ -n "$BLUE_INSTANCE_ID" ]; then
            VOLUME_ID=$(aws ec2 describe-volumes \
              --filters "Name=attachment.instance-id,Values=$BLUE_INSTANCE_ID" "Name=attachment.device,Values=/dev/sdf" \
              --query 'Volumes[0].VolumeId' \
              --output text 2>/dev/null || echo "")
            [ "$VOLUME_ID" = "None" ] && VOLUME_ID=""
            if [ -n "$VOLUME_ID" ]; then
              NEED_BLUE_TEARDOWN=true
              echo "  Found MongoDB volume on blue (device /dev/sdf): $VOLUME_ID"
            else
              VOLUME_ID=$(aws ec2 describe-volumes \
                --filters "Name=attachment.instance-id,Values=$BLUE_INSTANCE_ID" "Name=tag:Name,Values=$MONGODB_DATA_VOLUME_TAG" \
                --query 'Volumes[0].VolumeId' \
                --output text 2>/dev/null || echo "")
              [ "$VOLUME_ID" = "None" ] && VOLUME_ID=""
              if [ -n "$VOLUME_ID" ]; then
                NEED_BLUE_TEARDOWN=true
                echo "  Found MongoDB volume on blue (tag match, any device): $VOLUME_ID"
              fi
            fi
          fi
          if [ "$NEED_BLUE_TEARDOWN" = "true" ]; then
            echo "  Stopping app and MongoDB on blue, then unmounting volume..."
            BLUE_CMD_ID=$(aws ssm send-command \
              --instance-ids "$BLUE_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "{\"commands\":[\"cd $DEPLOY_DIR && (docker compose stop 2>/dev/null || docker-compose stop 2>/dev/null || true)\",\"sleep 3\",\"sudo umount /opt/mongodb-data 2>/dev/null || true\"]}" \
              --timeout-seconds 120 \
              --query 'Command.CommandId' \
              --output text 2>/dev/null || echo "")
            if [ -n "$BLUE_CMD_ID" ]; then
              for i in 1 2 3 4 5 6; do
                ST=$(aws ssm get-command-invocation --command-id "$BLUE_CMD_ID" --instance-id "$BLUE_INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "Pending")
                [ "$ST" = "Success" ] && break
                [ "$ST" = "Failed" ] && echo "  ⚠️  Blue stop/unmount command failed (continuing anyway)" && break
                sleep 10
              done
            fi
            echo "  Detaching volume from blue..."
            VSTATE_PRE=$(aws ec2 describe-volumes --volume-ids "$VOLUME_ID" --query 'Volumes[0].State' --output text 2>/dev/null || echo "")
            if [ "$VSTATE_PRE" = "available" ]; then
              echo "  Volume already in state=available (fully detached) — skip detach call"
            else
              if ! aws ec2 detach-volume --volume-id "$VOLUME_ID"; then
                VSTATE2=$(aws ec2 describe-volumes --volume-ids "$VOLUME_ID" --query 'Volumes[0].State' --output text 2>/dev/null || echo "")
                if [ "$VSTATE2" != "available" ]; then
                  echo "  ❌ CRITICAL: detach-volume failed and volume is not 'available' (state=$VSTATE2). Refusing to continue."
                  exit 1
                fi
                echo "  detach API failed but volume is now available — continuing"
              fi
            fi
            # AWS: when fully detached, State=available. Attachments[0].State is NOT 'detached' (there is no attachment).
            echo "  Waiting for volume to reach state=available (fully detached)..."
            DETACH_OK=false
            for i in $(seq 1 36); do
              VSTATE=$(aws ec2 describe-volumes --volume-ids "$VOLUME_ID" --query 'Volumes[0].State' --output text 2>/dev/null || echo "")
              if [ "$VSTATE" = "available" ]; then
                DETACH_OK=true
                break
              fi
              if [ $((i % 6)) -eq 1 ]; then
                echo "  ... detach: volume state $VSTATE (wait $i/36)"
              fi
              sleep 5
            done
            if [ "$DETACH_OK" != "true" ]; then
              echo "  ❌ CRITICAL: Volume $VOLUME_ID did not become 'available' after detach — not safe to attach to green."
              exit 1
            fi
            echo "  Attaching volume to green at /dev/sdf..."
            if ! aws ec2 attach-volume --volume-id "$VOLUME_ID" --instance-id "$GREEN_INSTANCE_ID" --device /dev/sdf; then
              echo "  ❌ CRITICAL: attach-volume failed."
              exit 1
            fi
            echo "  Waiting for volume to attach to green (instance $GREEN_INSTANCE_ID)..."
            ATTACH_OK=false
            for i in $(seq 1 36); do
              ASTATE=$(aws ec2 describe-volumes --volume-ids "$VOLUME_ID" --query 'Volumes[0].Attachments[0].State' --output text 2>/dev/null || echo "")
              AINST=$(aws ec2 describe-volumes --volume-ids "$VOLUME_ID" --query 'Volumes[0].Attachments[0].InstanceId' --output text 2>/dev/null || echo "")
              if [ "$ASTATE" = "attached" ] && [ "$AINST" = "$GREEN_INSTANCE_ID" ]; then
                ATTACH_OK=true
                break
              fi
              if [ $((i % 6)) -eq 1 ]; then
                echo "  ... attach: state=$ASTATE instance=$AINST (wait $i/36)"
              fi
              sleep 5
            done
            if [ "$ATTACH_OK" != "true" ]; then
              echo "  ❌ CRITICAL: Volume did not attach to green $GREEN_INSTANCE_ID. Aborting swap."
              exit 1
            fi
            echo "  Waiting 20s for block device to appear on green OS..."
            sleep 20
          else
            # Volume may already be on green after a failed swap (attach succeeded; later step failed).
            V_ON_GREEN=""
            V_ON_GREEN=$(aws ec2 describe-volumes \
              --filters "Name=attachment.instance-id,Values=$GREEN_INSTANCE_ID" "Name=attachment.device,Values=/dev/sdf" \
              --query 'Volumes[0].VolumeId' \
              --output text 2>/dev/null || echo "")
            [ "$V_ON_GREEN" = "None" ] && V_ON_GREEN=""
            if [ -z "$V_ON_GREEN" ]; then
              V_ON_GREEN=$(aws ec2 describe-volumes \
                --filters "Name=attachment.instance-id,Values=$GREEN_INSTANCE_ID" "Name=tag:Name,Values=$MONGODB_DATA_VOLUME_TAG" \
                --query 'Volumes[0].VolumeId' \
                --output text 2>/dev/null || echo "")
              [ "$V_ON_GREEN" = "None" ] && V_ON_GREEN=""
            fi
            if [ -n "$V_ON_GREEN" ]; then
              VOLUME_ID="$V_ON_GREEN"
              echo "  MongoDB volume already on green ($VOLUME_ID) — skip detach/attach; mount/restart only."
            else
              echo "  No MongoDB volume attached to blue; looking for detached volume (tag Name=$MONGODB_DATA_VOLUME_TAG, state=available)..."
              AVAIL_IDS=$(aws ec2 describe-volumes \
                --filters "Name=tag:Name,Values=$MONGODB_DATA_VOLUME_TAG" "Name=status,Values=available" \
                --query 'Volumes[*].VolumeId' \
                --output text 2>/dev/null || echo "")
              AVAIL_COUNT=0
              ORPHAN_ID=""
              for vid in $AVAIL_IDS; do
                [ "$vid" = "None" ] && continue
                ORPHAN_ID="$vid"
                AVAIL_COUNT=$((AVAIL_COUNT + 1))
              done
              if [ "$AVAIL_COUNT" -eq 1 ]; then
                echo "  Attaching detached volume $ORPHAN_ID directly to green (recover from Terraform/live drift)..."
                if ! aws ec2 attach-volume --volume-id "$ORPHAN_ID" --instance-id "$GREEN_INSTANCE_ID" --device /dev/sdf; then
                  echo "  ❌ CRITICAL: attach-volume failed for orphan volume $ORPHAN_ID"
                  exit 1
                fi
                VOLUME_ID="$ORPHAN_ID"
                echo "  Waiting for volume to attach to green..."
                ATTACH_OK_ORPHAN=false
                for i in $(seq 1 36); do
                  ASTATE=$(aws ec2 describe-volumes --volume-ids "$VOLUME_ID" --query 'Volumes[0].Attachments[0].State' --output text 2>/dev/null || echo "")
                  AINST=$(aws ec2 describe-volumes --volume-ids "$VOLUME_ID" --query 'Volumes[0].Attachments[0].InstanceId' --output text 2>/dev/null || echo "")
                  if [ "$ASTATE" = "attached" ] && [ "$AINST" = "$GREEN_INSTANCE_ID" ]; then
                    ATTACH_OK_ORPHAN=true
                    break
                  fi
                  sleep 5
                done
                if [ "$ATTACH_OK_ORPHAN" != "true" ]; then
                  echo "  ❌ CRITICAL: Orphan volume did not attach to green $GREEN_INSTANCE_ID"
                  exit 1
                fi
                echo "  Waiting 20s for block device to appear on green OS..."
                sleep 20
              elif [ "$AVAIL_COUNT" -eq 0 ]; then
                echo "  ❌ CRITICAL: No MongoDB data volume on blue, not on green, and none available with tag $MONGODB_DATA_VOLUME_TAG."
                echo "     Refusing to swap — green would run with an empty database."
                exit 1
              else
                echo "  ❌ CRITICAL: Multiple ($AVAIL_COUNT) available volumes with tag $MONGODB_DATA_VOLUME_TAG; resolve in AWS before swap."
                exit 1
              fi
            fi
          fi
          if [ -z "$VOLUME_ID" ]; then
            echo "  ❌ CRITICAL: Could not resolve MongoDB EBS volume ID for green before mount. Refusing to swap."
            exit 1
          fi
          echo "  Mounting volume on green and restarting MongoDB..."
          MOUNT_SCRIPT_PATH=""
          for _srcdir in "${CODEBUILD_SRC_DIR_SourceOutput:-}" "${CODEBUILD_SRC_DIR}" "${CODEBUILD_SRC_DIR_GreenInstanceOutput:-}"; do
            [ -z "$_srcdir" ] && continue
            _cand="${_srcdir}/packages/backend/devops/scripts/swap-step0-mount-mongodb.sh"
            if [ -f "$_cand" ]; then MOUNT_SCRIPT_PATH="$_cand"; break; fi
          done
          if [ -z "$MOUNT_SCRIPT_PATH" ]; then
            echo "  ❌ CRITICAL: swap-step0-mount-mongodb.sh not found in pipeline source artifact"
            exit 1
          fi
          SCRIPT_B64=$(base64 -w0 "$MOUNT_SCRIPT_PATH")
          GREEN_CMD_ID=$(aws ssm send-command \
            --instance-ids "$GREEN_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"echo $SCRIPT_B64 | base64 -d > /tmp/swap-step0.sh\",\"chmod +x /tmp/swap-step0.sh\",\"DEPLOY_DIR=$DEPLOY_DIR bash /tmp/swap-step0.sh\"]}" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text 2>/dev/null || echo "")
          GREEN_STEP0_OK=false
          if [ -z "$GREEN_CMD_ID" ]; then
            echo "  ❌ Could not send SSM command to green (check SSM agent / instance profile)."
          else
            echo "  Step 0 SSM CommandId: $GREEN_CMD_ID (waiting up to ~15m for completion)..."
            for i in $(seq 1 90); do
              ST=$(aws ssm get-command-invocation --command-id "$GREEN_CMD_ID" --instance-id "$GREEN_INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "Pending")
              if [ "$ST" = "Success" ]; then
                echo "  ✅ MongoDB volume mounted and services restarted on green"
                GREEN_STEP0_OK=true
                break
              fi
              if [ "$ST" = "Failed" ] || [ "$ST" = "TimedOut" ] || [ "$ST" = "Cancelled" ]; then
                echo "  ❌ Green mount/restart SSM ended with status: $ST"
                aws ssm get-command-invocation --command-id "$GREEN_CMD_ID" --instance-id "$GREEN_INSTANCE_ID" --query '{StdOut:StandardOutputContent,StdErr:StandardErrorContent}' --output text 2>/dev/null | head -c 12000 || true
                break
              fi
              if [ $((i % 6)) -eq 1 ]; then
                echo "  ... Step 0 SSM status: $ST (poll $i/90)"
              fi
              sleep 10
            done
          fi
          if [ "$GREEN_STEP0_OK" != "true" ]; then
            echo "  ❌ CRITICAL: Step 0 (volume on green) did not succeed. Aborting to prevent data loss."
            if [ -n "${GREEN_CMD_ID:-}" ]; then
              aws ssm get-command-invocation --command-id "$GREEN_CMD_ID" --instance-id "$GREEN_INSTANCE_ID" --query '{Status:Status,Details:StatusDetails}' --output text 2>/dev/null | sed 's/^/     Last SSM: /' || true
            fi
            echo "     If status was Pending/Delayed: EC2 role needs AmazonSSMManagedInstanceCore (terraform: production_ssm_managed_core on bianca-production-role)."
            echo "     Or fix mount/docker on green via SSH, then re-run SwapAndTerminate."
            exit 1
          fi
          echo "  Verifying MongoDB data dir + live ping on green (refuse swap on empty or dead DB)..."
          MONGOVERIFY_CMD_ID=$(aws ssm send-command \
            --instance-ids "$GREEN_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"cd $DEPLOY_DIR && if ! ( sudo test -f /opt/mongodb-data/WiredTiger 2>/dev/null || sudo test -d /opt/mongodb-data/diagnostic.data 2>/dev/null ); then echo FATAL_mongodb_data_dir_empty; exit 1; fi\",\"cd $DEPLOY_DIR && ( docker compose exec -T mongodb mongosh --quiet --eval \\\"db.runCommand({ping:1}).ok\\\" 2>&1 | grep -q 1 ) || ( docker compose exec -T mongodb mongo --eval \\\"db.runCommand({ping:1}).ok\\\" --quiet 2>&1 | grep -q 1 )\"]}" \
            --timeout-seconds 120 \
            --query 'Command.CommandId' \
            --output text 2>/dev/null || echo "")
          MONGOVERIFY_OK=false
          if [ -n "$MONGOVERIFY_CMD_ID" ]; then
            for i in $(seq 1 30); do
              MVST=$(aws ssm get-command-invocation --command-id "$MONGOVERIFY_CMD_ID" --instance-id "$GREEN_INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "Pending")
              if [ "$MVST" = "Success" ]; then
                MONGOVERIFY_OK=true
                break
              fi
              if [ "$MVST" = "Failed" ] || [ "$MVST" = "TimedOut" ] || [ "$MVST" = "Cancelled" ]; then
                aws ssm get-command-invocation --command-id "$MONGOVERIFY_CMD_ID" --instance-id "$GREEN_INSTANCE_ID" --query '{StdOut:StandardOutputContent,StdErr:StandardErrorContent}' --output text 2>/dev/null | head -c 8000 || true
                break
              fi
              sleep 5
            done
          fi
          if [ "$MONGOVERIFY_OK" != "true" ]; then
            echo "  ❌ CRITICAL: MongoDB verification SSM did not succeed — refusing to swap to prevent traffic to a non-working database."
            exit 1
          fi
          echo "  ✅ MongoDB verification passed"
        fi
        
        # Verify green instance is healthy before swapping
        echo "Verifying green instance is healthy..."
        GREEN_HEALTH=$(aws elbv2 describe-target-health \
          --target-group-arn ${API_TARGET_GROUP_ARN} \
          --targets Id=$GREEN_INSTANCE_ID \
          --query 'TargetHealthDescriptions[0].TargetHealth.State' \
          --output text 2>/dev/null || echo "unused")
        
        if [ "$GREEN_HEALTH" != "healthy" ] && [ "$GREEN_HEALTH" != "unused" ]; then
          echo "⚠️  Warning: Green instance health check shows: $GREEN_HEALTH"
          echo "   This might be normal if it's not yet registered with target group"
        fi
        
        # Step 1: Register green instance with ALB target groups
        echo ""
        echo "Step 1: Registering green instance with ALB target groups..."
        
        # Register with API target group (port 3000)
        echo "  Registering with API target group (port 3000)..."
        aws elbv2 register-targets \
          --target-group-arn ${API_TARGET_GROUP_ARN} \
          --targets Id=$GREEN_INSTANCE_ID,Port=3000 || {
          echo "  ⚠️  Warning: Failed to register with API target group (might already be registered)"
        }
        
        # Register with Frontend target group (port 80)
        echo "  Registering with Frontend target group (port 80)..."
        aws elbv2 register-targets \
          --target-group-arn ${FRONTEND_TARGET_GROUP_ARN} \
          --targets Id=$GREEN_INSTANCE_ID,Port=80 || {
          echo "  ⚠️  Warning: Failed to register with Frontend target group (might already be registered)"
        }
        
        echo "  ✅ Green instance registered with target groups"
        
        # Step 1.5: Deregister any other targets (orphans) so only green remains
        echo ""
        echo "Step 1.5: Ensuring only green instance is in target groups (deregister orphans)..."
        for TG_ARN in ${API_TARGET_GROUP_ARN} ${FRONTEND_TARGET_GROUP_ARN}; do
          aws elbv2 describe-target-health --target-group-arn "$TG_ARN" \
            --query "TargetHealthDescriptions[?TargetHealth.State!='draining'].[Target.Id,Target.Port]" --output text 2>/dev/null | while read TID TPORT; do
            [ -z "$TID" ] && continue
            if [ "$TID" != "$GREEN_INSTANCE_ID" ]; then
              echo "  Deregistering orphan $TID (port $TPORT) from target group..."
              aws elbv2 deregister-targets --target-group-arn "$TG_ARN" --targets Id=$TID,Port=$TPORT 2>/dev/null || true
            fi
          done
        done
        echo "  ✅ Orphan targets deregistered (only green remains)"
        
        # Wait for target to become healthy
        echo ""
        echo "Step 2: Waiting for green instance to become healthy in target groups..."
        MAX_WAIT=300  # 5 minutes max
        ELAPSED=0
        HEALTHY=false
        
        while [ $ELAPSED -lt $MAX_WAIT ]; do
          API_HEALTH=$(aws elbv2 describe-target-health \
            --target-group-arn ${API_TARGET_GROUP_ARN} \
            --targets Id=$GREEN_INSTANCE_ID \
            --query 'TargetHealthDescriptions[0].TargetHealth.State' \
            --output text 2>/dev/null || echo "unused")
          
          FRONTEND_HEALTH=$(aws elbv2 describe-target-health \
            --target-group-arn ${FRONTEND_TARGET_GROUP_ARN} \
            --targets Id=$GREEN_INSTANCE_ID \
            --query 'TargetHealthDescriptions[0].TargetHealth.State' \
            --output text 2>/dev/null || echo "unused")
          
          if [ "$API_HEALTH" = "healthy" ] && [ "$FRONTEND_HEALTH" = "healthy" ]; then
            echo "  ✅ Green instance is healthy in both target groups!"
            HEALTHY=true
            break
          fi
          
          echo "  API: $API_HEALTH, Frontend: $FRONTEND_HEALTH (waiting...)"
          sleep 10
          ELAPSED=$((ELAPSED + 10))
        done
        
        if [ "$HEALTHY" != "true" ]; then
          echo "❌ ERROR: Green instance did not become healthy within timeout"
          echo "   API Health: $API_HEALTH"
          echo "   Frontend Health: $FRONTEND_HEALTH"
          echo ""
          echo "   CRITICAL: Cannot swap traffic to unhealthy green instance!"
          echo "   This would cause downtime. Blue instance will remain serving traffic."
          echo "   Please investigate why green instance is not healthy."
          exit 1
        fi

        # Verify super-admin vhost on green (Host header) before cutting traffic
        if [ -n "${ADMIN_URL:-}" ] && [ -n "$GREEN_INSTANCE_ID" ]; then
          ADMIN_HOST="${ADMIN_URL#https://}"
          ADMIN_HOST="${ADMIN_HOST#http://}"
          ADMIN_HOST="${ADMIN_HOST%%/*}"
          GREEN_IP=$(aws ec2 describe-instances --instance-ids "$GREEN_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text 2>/dev/null || echo "")
          if [ -n "$GREEN_IP" ] && [ "$GREEN_IP" != "None" ]; then
            echo ""
            echo "Step 2.25: Verifying admin console on green (Host: $ADMIN_HOST)..."
            ADMIN_HTML=$(curl -s --max-time 30 -H "Host: $ADMIN_HOST" "http://${GREEN_IP}/" 2>/dev/null || echo "")
            if ! echo "$ADMIN_HTML" | grep -q "Bianca Admin"; then
              echo "❌ FATAL: admin host on green serves wrong app (missing nginx admin block or admin container)"
              echo "$ADMIN_HTML" | grep -E '<title>|index-' | head -5 || true
              exit 1
            fi
            echo "  ✅ Green serves Bianca Admin for $ADMIN_HOST"
          fi
        fi
        
        # Step 2.5: Move Elastic IP to green BEFORE terminating blue.
        # If blue held the EIP, terminating blue disassociates it — a failed late association
        # left production with an unallocated EIP and ephemeral-only instance (SIP/Twilio broken).
        if [ -n "$EIP_ALLOCATION_ID" ]; then
          echo ""
          echo "Step 2.5: Associating Elastic IP with green instance (before blue termination)..."
          if aws ec2 associate-address \
            --instance-id "$GREEN_INSTANCE_ID" \
            --allocation-id "$EIP_ALLOCATION_ID" \
            --allow-reassociation; then
            echo "  ✅ EIP is on green — safe to terminate blue without orphaning the address"
            echo "  Waiting 15s for propagation, then syncing Asterisk EXTERNAL_ADDRESS via SSM..."
            sleep 15
            # Must match DEPLOY_DIR (/opt/bianca-staging | /opt/bianca-production), not BLUE_TAG#bianca- (/opt/staging would be wrong)
            CMD="cd $DEPLOY_DIR && PUBLIC_IP=\$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4) && sed -i.bak -e 's|EXTERNAL_ADDRESS=[^[:space:]]*|EXTERNAL_ADDRESS='\$PUBLIC_IP'|' -e 's|ASTERISK_PUBLIC_IP=[^[:space:]]*|ASTERISK_PUBLIC_IP='\$PUBLIC_IP'|' docker-compose.yml && (docker compose up -d asterisk app 2>/dev/null || docker-compose up -d asterisk app)"
            if command_id=$(aws ssm send-command \
              --instance-ids "$GREEN_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "{\"commands\":[\"$CMD\"]}" \
              --timeout-seconds 60 \
              --query 'Command.CommandId' \
              --output text 2>/dev/null); then
              echo "  SSM Asterisk/app restart sent (CommandId: $command_id)"
              for i in 1 2 3 4 5 6; do
                status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$GREEN_INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "Pending")
                [ "$status" = "Success" ] && echo "  ✅ SSM completed" && break
                [ "$status" = "Failed" ] && echo "  ⚠️  SSM failed — check instance; EIP is still associated" && break
                sleep 10
              done
            else
              echo "  ⚠️  Could not send SSM (EIP is associated; fix compose/Asterisk on host if needed)"
            fi
          else
            echo "  ❌ FATAL: EIP association failed — refusing to terminate blue (would orphan SIP)."
            exit 1
          fi
        else
          echo ""
          echo "Step 2.5: No STAGING_EIP_ALLOCATION_ID / PRODUCTION_EIP_ALLOCATION_ID — skipping EIP (non-SIP env)"
        fi
        
        # Step 3: Deregister blue instance from target groups (if it exists)
        if [ -n "$BLUE_INSTANCE_ID" ]; then
          echo ""
          echo "Step 3: Deregistering blue instance from target groups..."
          
          # Deregister from API target group
          echo "  Deregistering from API target group..."
          aws elbv2 deregister-targets \
            --target-group-arn ${API_TARGET_GROUP_ARN} \
            --targets Id=$BLUE_INSTANCE_ID,Port=3000 || {
            echo "  ⚠️  Blue instance not registered with API target group (might have been removed)"
          }
          
          # Deregister from Frontend target group
          echo "  Deregistering from Frontend target group..."
          aws elbv2 deregister-targets \
            --target-group-arn ${FRONTEND_TARGET_GROUP_ARN} \
            --targets Id=$BLUE_INSTANCE_ID,Port=80 || {
            echo "  ⚠️  Blue instance not registered with Frontend target group (might have been removed)"
          }
          
          echo "  ✅ Blue instance deregistered from target groups"
          
          # Wait a moment for connections to drain
          echo "  Waiting 30 seconds for connections to drain..."
          sleep 30
          
          # Step 4: Terminate blue instance
          echo ""
          echo "Step 4: Terminating blue instance..."
          aws ec2 terminate-instances --instance-ids $BLUE_INSTANCE_ID
          echo "  ✅ Blue instance termination initiated: $BLUE_INSTANCE_ID"
          
          # Wait for termination to complete
          echo "  Waiting for blue instance to terminate..."
          aws ec2 wait instance-terminated --instance-ids $BLUE_INSTANCE_ID
          echo "  ✅ Blue instance terminated"
        
          if [ -n "$DUPLICATE_BLUE_INSTANCE_IDS" ]; then
            echo ""
            echo "Step 4b: Terminating stale duplicate instance(s) (same Name tag, no data volume)..."
            for dup in $DUPLICATE_BLUE_INSTANCE_IDS; do
              [ -z "$dup" ] && continue
              echo "  Terminating duplicate $dup..."
              aws ec2 terminate-instances --instance-ids "$dup" || echo "  ⚠️  Could not terminate $dup"
            done
            for dup in $DUPLICATE_BLUE_INSTANCE_IDS; do
              [ -z "$dup" ] && continue
              aws ec2 wait instance-terminated --instance-ids "$dup" 2>/dev/null || true
            done
            echo "  ✅ Duplicate instance cleanup finished"
          fi
        else
          echo ""
          echo "Step 3: No blue instance to terminate (first deployment or already terminated)"
        fi
        
        # Step 5: Rename green instance to become the new "blue" for next deployment
        echo ""
        echo "Step 5: Renaming green instance to '$BLUE_TAG' for next deployment..."
        aws ec2 create-tags \
          --resources $GREEN_INSTANCE_ID \
          --tags Key=Name,Value=$BLUE_TAG Key=DeploymentType,Value=blue || {
          echo "  ⚠️  Warning: Failed to rename instance (non-critical)"
        }
        
        # Remove green tag
        aws ec2 delete-tags \
          --resources $GREEN_INSTANCE_ID \
          --tags Key=Name,Value=$GREEN_TAG || {
          echo "  ⚠️  Warning: Failed to remove green tag (non-critical)"
        }
        
        # Step 6: Verify EIP stayed on the live instance (belt-and-suspenders)
        LIVE_INSTANCE_ID="$GREEN_INSTANCE_ID"
        if [ -n "$EIP_ALLOCATION_ID" ]; then
          echo ""
          echo "Step 6: Verifying Elastic IP association..."
          EIP_ON=$(aws ec2 describe-addresses --allocation-ids "$EIP_ALLOCATION_ID" --query 'Addresses[0].InstanceId' --output text 2>/dev/null || echo "")
          if [ "$EIP_ON" = "None" ]; then EIP_ON=""; fi
          if [ "$EIP_ON" != "$LIVE_INSTANCE_ID" ]; then
            echo "  ⚠️  EIP on '$EIP_ON', expected $LIVE_INSTANCE_ID — re-associating..."
            if ! aws ec2 associate-address \
              --instance-id "$LIVE_INSTANCE_ID" \
              --allocation-id "$EIP_ALLOCATION_ID" \
              --allow-reassociation; then
              echo "  ❌ FATAL: EIP $EIP_ALLOCATION_ID is not on live instance and re-association failed"
              exit 1
            fi
            sleep 10
            EIP_ON=$(aws ec2 describe-addresses --allocation-ids "$EIP_ALLOCATION_ID" --query 'Addresses[0].InstanceId' --output text 2>/dev/null || echo "")
            if [ "$EIP_ON" = "None" ]; then EIP_ON=""; fi
            if [ "$EIP_ON" != "$LIVE_INSTANCE_ID" ]; then
              echo "  ❌ FATAL: EIP $EIP_ALLOCATION_ID is on '$EIP_ON', expected live instance $LIVE_INSTANCE_ID"
              exit 1
            fi
          fi
          echo "  ✅ EIP verified on instance $LIVE_INSTANCE_ID"
        fi
        
        # Step 7: Update Terraform state so it points at the new blue instance (avoids drift on next terraform apply)
        echo ""
        echo "Step 7: Updating Terraform state to point at new blue instance..."
        if [ "$BLUE_TAG" = "bianca-staging" ]; then
          TF_INSTANCE_RESOURCE="aws_instance.staging"
        elif [ "$BLUE_TAG" = "bianca-production" ]; then
          TF_INSTANCE_RESOURCE="aws_instance.production"
        else
          echo "  ⚠️  Unknown BLUE_TAG ($BLUE_TAG), skipping Terraform state update"
          TF_INSTANCE_RESOURCE=""
        fi
        if [ -n "$TF_INSTANCE_RESOURCE" ]; then
          for _srcdir in "${CODEBUILD_SRC_DIR}" "${CODEBUILD_SRC_DIR_SourceOutput:-}"; do
            [ -z "$_srcdir" ] && continue
            _tfdir="${_srcdir}/packages/backend/devops/terraform"
            if [ -d "$_tfdir" ] && [ -f "$_tfdir/backend.tf" ]; then TF_DIR="$_tfdir"; break; fi
          done
          if [ -n "${TF_DIR:-}" ] && [ -f "$TF_DIR/backend.tf" ]; then
            echo "  Installing Terraform..."
            TF_VER="1.5.7"
            curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VER}/terraform_${TF_VER}_linux_amd64.zip" -o /tmp/terraform.zip
            unzip -o -q /tmp/terraform.zip -d /tmp && chmod +x /tmp/terraform && mv /tmp/terraform /usr/local/bin/
            terraform -version
            echo "  Initializing Terraform (S3 backend)..."
            cd "$TF_DIR"
            terraform init -input=false -reconfigure
            echo "  Removing old instance from state and importing new blue..."
            terraform state rm "$TF_INSTANCE_RESOURCE" 2>/dev/null || true
            if terraform import -input=false "$TF_INSTANCE_RESOURCE" "$GREEN_INSTANCE_ID"; then
              echo "  ✅ Terraform state updated: $TF_INSTANCE_RESOURCE = $GREEN_INSTANCE_ID"
            else
              echo "  ⚠️  Terraform import failed (non-fatal). Next terraform apply may recreate the instance."
            fi
          else
            echo "  ⚠️  Terraform dir not found (check artifact paths), skipping state update"
          fi
        fi
        
        echo ""
        echo "✅ Blue-green deployment swap completed successfully!"
        echo "   Green instance is now serving traffic"
        if [ -n "$BLUE_INSTANCE_ID" ]; then
          echo "   Old blue instance has been terminated"
        fi

  post_build:
    commands:
      - echo "Blue-green deployment swap completed"
