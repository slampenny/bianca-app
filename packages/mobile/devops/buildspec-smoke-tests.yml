version: 0.2

# Smoke Tests - Quick verification that frontend builds and loads correctly
# This runs between Build and Deploy to catch frontend issues before deployment
env:
  variables:
    NODE_ENV: test
    FRONTEND_PORT: 8082

phases:
  pre_build:
    commands:
      - echo "Starting frontend smoke tests..."
      - echo "Installing Node.js 20..."
      - |
        export NVM_DIR="$HOME/.nvm"
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        nvm install 20
        nvm use 20
        echo "✅ Node.js 20 installed"
      - echo "Locating frontend source code..."
      - |
        FRONTEND_DIR="$CODEBUILD_SRC_DIR/packages/mobile"
        if [ ! -f "$FRONTEND_DIR/package.json" ]; then
          echo "❌ ERROR: Frontend package.json not found at $FRONTEND_DIR"
          exit 1
        fi
        echo "✅ Frontend source found at: $FRONTEND_DIR"
        export FRONTEND_DIR="$FRONTEND_DIR"
      - echo "Installing frontend dependencies..."
      - |
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        nvm use 20
        cd "$FRONTEND_DIR" || exit 1
        yarn install --frozen-lockfile || (echo "⚠️  Lockfile out of sync, updating..." && yarn install)
        echo "✅ Dependencies installed"

  build:
    commands:
      - echo "Building frontend for smoke tests..."
      - |
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        nvm use 20
        cd "$FRONTEND_DIR" || exit 1
        
        # Build the frontend (use staging config for staging pipeline, production for production)
        if [ "$BUILD_ENV" = "staging" ] || [ -z "$BUILD_ENV" ]; then
          echo "Building for staging environment..."
          cp app.staging.json app.json 2>/dev/null || echo "app.staging.json not found, using default app.json"
          EXPO_PUBLIC_ENVIRONMENT=staging yarn bundle:web:staging || EXPO_PUBLIC_ENVIRONMENT=staging node node_modules/.bin/expo export --platform web
        else
          echo "Building for production environment..."
          EXPO_PUBLIC_BUILD_VERSION=$BUILD_VERSION yarn bundle:web || node node_modules/.bin/expo export --platform web
        fi
        
        if [ ! -d "dist" ]; then
          echo "❌ ERROR: Frontend build failed - dist directory not found"
          exit 1
        fi
        echo "✅ Frontend built successfully"
      - echo "Installing Playwright for smoke tests..."
      - |
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        nvm use 20
        cd "$FRONTEND_DIR" || exit 1
        yarn playwright install --with-deps chromium || exit 1
        echo "✅ Playwright installed"
      - echo "Starting frontend server and running smoke tests..."
      - |
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        nvm use 20
        cd "$FRONTEND_DIR" || exit 1
        
        # Start server in background and save PID to file
        npx serve dist -l $FRONTEND_PORT > /tmp/frontend-server.log 2>&1 &
        echo $! > /tmp/frontend-server.pid
        SERVER_PID=$(cat /tmp/frontend-server.pid)
        echo "Frontend server started with PID: $SERVER_PID"
        
        # Wait for server to be ready
        echo "Waiting for frontend server to be ready..."
        i=1
        while [ $i -le 30 ]; do
          if curl -f http://localhost:$FRONTEND_PORT > /dev/null 2>&1; then
            echo "✅ Frontend server is ready!"
            break
          fi
          sleep 1
          i=$((i + 1))
        done
        
        if [ $i -gt 30 ]; then
          echo "❌ ERROR: Frontend server failed to start"
          echo "Server logs:"
          cat /tmp/frontend-server.log
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        fi
        
        # Set environment variables for Playwright
        export FRONTEND_URL="http://localhost:$FRONTEND_PORT"
        export BASE_URL="http://localhost:$FRONTEND_PORT"
        export CODEBUILD_BUILD_ID="smoke-test"  # Disable webServer in playwright.config.ts
        
        # Run the app-loading smoke test
        echo "Running app-loading smoke test..."
        NODE_ENV=test npx playwright test test/e2e/app-loading.e2e.test.ts --reporter=list
        TEST_EXIT_CODE=$?
        
        # Stop server
        echo "Stopping frontend server..."
        SERVER_PID=$(cat /tmp/frontend-server.pid 2>/dev/null || echo "")
        if [ -n "$SERVER_PID" ]; then
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
        fi
        
        # Exit with test result
        if [ $TEST_EXIT_CODE -ne 0 ]; then
          echo "❌ Smoke test failed!"
          exit $TEST_EXIT_CODE
        fi
        
        echo "✅ Smoke tests passed!"

  post_build:
    commands:
      - echo "✅ Frontend smoke tests completed successfully"
      - echo "Frontend is ready for deployment"

